; MiSTerLily firmware for the LILYGO T-Display-S3 (ESP32-S3R8, 16 MB flash, 8 MB OPI PSRAM).

[platformio]
default_envs = tdisplay_s3

[env]
; Pinned: espressif32 6.13.0 ships Arduino core 2.0.17.
platform = espressif32@6.13.0
board = lilygo-t-display-s3
framework = arduino
lib_deps =
    lovyan03/LovyanGFX@1.2.19
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    ; The PlatformIO board file omits this (LILYGO's own board file has it).
    -DBOARD_HAS_PSRAM
    ; The CDC port is the protocol channel: core log output there would corrupt it.
    -DCORE_DEBUG_LEVEL=0
    -Wall
monitor_speed = 115200
upload_speed = 921600

[env:tdisplay_s3]
build_flags =
    ${env.build_flags}
    -DMDS_DEBUG_LOG=0

; Same firmware with our debug log on UART0 (GPIO43 TX / GPIO44 RX, 115200 baud).
; The USB CDC port stays clean in both builds.
[env:tdisplay_s3_debug]
build_flags =
    ${env.build_flags}
    -DMDS_DEBUG_LOG=1
