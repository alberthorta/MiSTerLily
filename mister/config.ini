# MiSTerLily settings on the MiSTer (/media/fat/MiSTerLily/config.ini). KEY="value" lines.
# Restart after a change: /media/fat/MiSTerLily/S60misterlily restart

# Colour pictures: <core>.png or <core>.jpg (320x170, see tools/convert_asset.py).
ART_DIR="/media/fat/MiSTerLily/art"

# tty2oled pictures, used when there is no colour picture. Same options as tty2oled.
TTY2OLED_PICS="/media/fat/tty2oled/pics"
USE_TTY2OLED_PICS="yes"
USE_GSC_PICTURE="yes"
USE_US_PICTURE="no"
USE_TEXT_PICTURE="no"

# Brightness 0..255 and 180 degree rotation (yes/no). The board also remembers them.
CONTRAST="255"
ROTATE="no"

# Turn the backlight off after this many minutes without a core change (0 = never).
# Empty = keep what the board has stored (default never). Any core change wakes it.
IDLE_MINUTES=""

# Fixed device instead of auto-detection, e.g. "/dev/ttyACM0". Empty = find it.
TTYDEV=""

# Filled in by install.sh.
MDS_SERIAL=""
